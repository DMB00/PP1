[tool.poetry]
name = "pythonproject1"
version = "0.1.0"
description = ""
authors = ["Your Name <user@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.0.0"
black = "^24.0.0"
isort = "^5.13.0"
mypy = "^1.8.0"
mypy-extensions = "^1.0.0"
flake8-docstrings = "^1.7.0"
flake8-comprehensions = "^4.0.0"
flake8-bugbear = "^24.0.0"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | \.mypy_cache
  | \.pytest_cache
  | migrations
  | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_sort_within_sections = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["pythonproject1"]
known_third_party = ["requests", "django", "flask"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
exclude = [
    '^\.venv/',
    '^venv/',
    '^build/',
    '^dist/',
    '^\.mypy_cache/',
    '^migrations/',
]

[tool.flake8]
max-line-length = 88
ignore = "E203, W503, E501, F401, F403"
max-complexity = 15
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".mypy_cache",
    ".pytest_cache",
    "migrations",
    "node_modules",
    "build",
    "dist",
    "docs"
]
enable-extensions = [
    "flake8-docstrings",
    "flake8-comprehensions",
    "flake8-bugbear"
]

[tool.poetry.scripts]
format = "black . && isort ."
lint = "flake8 ."
type-check = "mypy ."
check-all = "black --check . && isort --check . && flake8 . && mypy ."
fix-all = "black . && isort ."

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"